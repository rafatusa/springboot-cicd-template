##############################################################################
# springboot-cicd-template — Enterprise Reusable CI/CD Pipeline
#
# REPO: rafatusa/springboot-cicd-template
#
# This is a REUSABLE WORKFLOW (on: workflow_call).
# It is called from the APPLICATION REPO (springboot-api) like this:
#
#   jobs:
#     enterprise:
#       uses: rafatusa/springboot-cicd-template/.github/workflows/enterprise-pipeline.yml@main
#       with:
#         image_name: "rafatusa/springboot-api"
#         java_version: "17"
#         aws_region: "us-east-1"
#       secrets: inherit      ← ALL secrets flow from the caller repo automatically
#
# STAGES (all 12 run inside THIS template repo's runner):
#   1  · Code Quality    — Checkstyle + SpotBugs
#   2  · Unit Tests      — Maven Surefire + JaCoCo
#   3  · Integration     — Maven Failsafe
#   4  · Security Scan   — OWASP Dependency Check
#   5  · Build JAR       — mvn package
#   6  · Docker Push     — GHCR (ghcr.io/<image_name>:<sha>)
#   7  · Provision       — Terraform (EC2 + EIP + SG + IAM)
#   8  · Configure       — Ansible (Docker runtime + nginx + app container)
#   9  · Verify          — Health check with retries
#   10 · Smoke Tests     — curl-based API assertions
#   11 · Performance     — k6 load test (50 VUs, 180s, p95<500ms)
#   12 · Notify          — Summary + auto-rollback signal on failure
##############################################################################
name: Enterprise CI/CD Pipeline

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name (owner/repo for GHCR)"
        required: true
        type: string
      java_version:
        description: "Java version (default: 17)"
        required: false
        type: string
        default: "17"
      aws_region:
        description: "AWS region (default: us-east-1)"
        required: false
        type: string
        default: "us-east-1"
      instance_type:
        description: "EC2 instance type"
        required: false
        type: string
        default: "t3.small"
      health_endpoint:
        description: "Health check path"
        required: false
        type: string
        default: "/actuator/health"
      run_perf_tests:
        description: "Run k6 performance tests"
        required: false
        type: boolean
        default: true
      owasp_cvss_threshold:
        description: "OWASP CVSS fail threshold"
        required: false
        type: string
        default: "9"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      TF_STATE_BUCKET:
        required: true
      PROJECT_NAME:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_PUBLIC_KEY:
        required: true
      SSH_USER:
        required: true

defaults:
  run:
    shell: bash

##############################################################################
# Stage 1: Code Quality — Checkstyle + SpotBugs
##############################################################################
jobs:
  lint:
    name: "Stage 1 · Code Quality (Checkstyle + SpotBugs)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check --no-transfer-progress

      - name: SpotBugs static analysis
        run: mvn -B spotbugs:check --no-transfer-progress

##############################################################################
# Stage 2: Unit Tests + JaCoCo Coverage
##############################################################################
  unit-tests:
    name: "Stage 2 · Unit Tests + JaCoCo"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn -B test --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

##############################################################################
# Stage 3: Integration Tests
##############################################################################
  integration-tests:
    name: "Stage 3 · Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Run integration tests
        run: mvn -B verify -DskipUnitTests --no-transfer-progress

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          retention-days: 7

##############################################################################
# Stage 4: Security Scanning — OWASP Dependency Check
##############################################################################
  security-scan:
    name: "Stage 4 · Security Scan (OWASP)"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          cache: maven

      - name: OWASP Dependency Check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=${{ inputs.owasp_cvss_threshold }} \
            -DautoUpdate=false \
            -DfailOnError=false \
            --no-transfer-progress

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-security-report
          path: target/dependency-check-report.*
          retention-days: 30

##############################################################################
# Stage 5: Build Application JAR
##############################################################################
  build:
    name: "Stage 5 · Build JAR"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 1

##############################################################################
# Stage 6: Docker Build & Push → GHCR
##############################################################################
  docker-build-push:
    name: "Stage 6 · Docker Build & Push (GHCR)"
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ inputs.image_name }}:${{ github.sha }}
            ghcr.io/${{ inputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

##############################################################################
# Stage 7: Terraform Provision
##############################################################################
  terraform-provision:
    name: "Stage 7 · Terraform Provision"
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ inputs.aws_region }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_region: ${{ inputs.aws_region }}
      TF_VAR_instance_type: ${{ inputs.instance_type }}
    outputs:
      instance_ip: ${{ steps.tf_output.outputs.instance_ip }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}"
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: infra

      - name: Get instance IP
        id: tf_output
        run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

##############################################################################
# Stage 8: Ansible Configure
##############################################################################
  ansible-configure:
    name: "Stage 8 · Ansible Configure"
    runs-on: ubuntu-latest
    needs: [terraform-provision]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Install Ansible
        run: pip install ansible-core

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Scan host keys
        run: ssh-keyscan -H "${{ needs.terraform-provision.outputs.instance_ip }}" >> ~/.ssh/known_hosts

      - name: Generate Ansible inventory
        run: |
          cat > ansible/inventory.ini <<EOF
          [app]
          ${{ needs.terraform-provision.outputs.instance_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key
          EOF

      - name: Run Ansible playbook
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml \
            -e "image_tag=$IMAGE_TAG" \
            -e "github_actor=${{ github.actor }}" \
            -e "github_token=${{ github.token }}" \
            -e "project_name=${{ secrets.PROJECT_NAME }}"

##############################################################################
# Stage 9: Deployment Verification
##############################################################################
  verify:
    name: "Stage 9 · Deployment Verification"
    runs-on: ubuntu-latest
    needs: [ansible-configure, terraform-provision]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init (read state)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}"
        working-directory: infra

      - name: Get instance IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Health check with retries
        run: |
          curl --fail --retry 15 --retry-delay 20 --retry-all-errors \
            http://${{ steps.get_ip.outputs.instance_ip }}${{ inputs.health_endpoint }}

##############################################################################
# Stage 10: Smoke Tests
##############################################################################
  smoke-tests:
    name: "Stage 10 · Smoke Tests"
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get instance IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}"
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Run smoke test suite
        run: |
          BASE="http://${{ steps.get_ip.outputs.instance_ip }}"
          echo "=== Smoke Test Suite against $BASE ==="

          echo "1. Landing page (/)..."
          curl --fail --silent --show-error "$BASE/"

          echo "2. Health endpoint..."
          HEALTH=$(curl --fail --silent "$BASE/actuator/health")
          echo "$HEALTH" | grep -q '"status":"UP"'

          echo "3. Items list (GET /api/v1/items)..."
          curl --fail --silent "$BASE/api/v1/items" | grep -q '"success":true'

          echo "4. Create item (POST /api/v1/items)..."
          CREATE=$(curl --fail --silent -X POST "$BASE/api/v1/items" \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke-test","description":"smoke test item"}')
          echo "$CREATE" | grep -q '"success":true'
          ITEM_ID=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")

          echo "5. Get item by ID (GET /api/v1/items/$ITEM_ID)..."
          curl --fail --silent "$BASE/api/v1/items/$ITEM_ID" | grep -q '"success":true'

          echo "=== All smoke tests PASSED ==="

##############################################################################
# Stage 11: Performance Tests (k6)
##############################################################################
  performance-tests:
    name: "Stage 11 · Performance Tests (k6)"
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: ${{ inputs.run_perf_tests == true }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Get instance IP
        id: get_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}"
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Run k6 performance test
        env:
          BASE_URL: "http://${{ steps.get_ip.outputs.instance_ip }}"
        run: k6 run tests/performance/load-test.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results
          path: tests/performance/results/
          retention-days: 7

##############################################################################
# Stage 12: Notify — summary + rollback signal
##############################################################################
  notify:
    name: "Stage 12 · Notify"
    runs-on: ubuntu-latest
    needs: [verify, smoke-tests, performance-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Deployment summary
        run: |
          echo "============================================================"
          echo "  ENTERPRISE PIPELINE COMPLETE"
          echo "============================================================"
          echo "  Repository : ${{ github.repository }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "  Actor      : ${{ github.actor }}"
          echo "  Timestamp  : $(date -u)"
          echo ""
          echo "  Stage results:"
          echo "    1  Code Quality   : ${{ needs.lint.result || 'skipped' }}"
          echo "    2  Unit Tests     : ${{ needs.unit-tests.result || 'skipped' }}"
          echo "    3  Integration    : ${{ needs.integration-tests.result || 'skipped' }}"
          echo "    4  Security Scan  : ${{ needs.security-scan.result || 'skipped' }}"
          echo "    5  Build JAR      : ${{ needs.build.result || 'skipped' }}"
          echo "    6  Docker Push    : ${{ needs.docker-build-push.result || 'skipped' }}"
          echo "    7  Terraform      : ${{ needs.terraform-provision.result || 'skipped' }}"
          echo "    8  Ansible        : ${{ needs.ansible-configure.result || 'skipped' }}"
          echo "    9  Verify         : ${{ needs.verify.result || 'skipped' }}"
          echo "    10 Smoke Tests    : ${{ needs.smoke-tests.result || 'skipped' }}"
          echo "    11 Performance    : ${{ needs.performance-tests.result || 'skipped' }}"
          echo "============================================================"

      - name: Signal rollback on failure
        if: |
          needs.verify.result == 'failure' ||
          needs.smoke-tests.result == 'failure'
        run: |
          echo "::error::Deployment verification or smoke tests failed."
          echo "::notice::Rollback recommended — trigger deploy.yml with the previous commit SHA."
          exit 1
